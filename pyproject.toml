[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "ical-conflict"
version = "0.1.0"
description = "Finds busy-event overlaps across explicit non-recurring UTC, IANA-zone and explicitly zoned all-day intervals."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Dr. Nripanka Das"}]
dependencies = []

[project.urls]
Repository = "https://github.com/nripankadas07/ical-conflict"
Issues = "https://github.com/nripankadas07/ical-conflict/issues"

[project.scripts]
ical-conflict = "ical_conflict:main"

[tool.setuptools]
py-modules = ["ical_conflict"]
