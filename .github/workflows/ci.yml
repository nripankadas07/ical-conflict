name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v
      - run: python -m compileall -q ical_conflict.py
      - run: python -m pip install --upgrade pip build pip-audit "setuptools>=83"
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: python -m pip check
      - run: python -m pip_audit
      - run: |
          cd "$RUNNER_TEMP"
          ical-conflict --help
      - run: ical-conflict example.ics
